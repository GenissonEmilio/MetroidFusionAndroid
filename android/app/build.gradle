plugins { id 'com.android.application' }
ext.gbaGame = [
    applicationId: 'io.github.genissonemilio.metroidfusion', versionCode: 1, versionName: '0.1.0-dev',
    title: 'Metroid Fusion', romSha1: ['ca33f4348c2c05dd330d37b97e2c5a69531dfe87'],
    romSize: 8388608, romFile: 'fusion_usa.gba', variant: 'fusion',
    biosRequired: false, biosSha1: '2e41f9d30ecdf1c4540edf89ac16f49bf327edb7',
    gameToml: rootProject.file('game_android.toml'), gameRoot: rootProject.file('..'),
    engineRoot: rootProject.file('../gbarecomp'), recompUiRoot: rootProject.file('../recomp-ui'),
    payloadVersion: '1', orientation: 'landscape', debugAbis: ['arm64-v8a'], nativeJobs: 2,
    cmakeArguments: providers.gradleProperty('fusionQaFastBuild').orNull == 'true'
        ? ['-DFUSION_QA_FAST_BUILD=ON'] : [],
    payloadDirs: [[from: rootProject.file('firmware'), into: 'bios']]
]
apply from: '../../gbarecomp/platform/android/gbarecomp-app.gradle'
apply from: '../sdl-java.gradle'
android {
    buildToolsVersion '35.0.0'
    defaultConfig {
        def albumTest = providers.gradleProperty('fusionAlbumTest').orNull == 'true'
        if (albumTest) applicationIdSuffix '.albumtest'
        manifestPlaceholders.fusionAppLabel = albumTest ? 'Metroid Fusion - Album teste' : '@string/app_name'
    }
    buildFeatures.buildConfig = true
    ndkVersion '28.2.13676358'
    externalNativeBuild.cmake.version '3.31.6'
    sourceSets.main {
        manifest.srcFile 'src/main/AndroidManifest.xml'
        java.srcDir 'src/main/java'
    }
    lint {
        disable 'ExpiredTargetSdkVersion'
        lintConfig rootProject.file('lint.xml')
    }
}
